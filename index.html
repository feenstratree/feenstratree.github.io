<!DOCTYPE html>
<html>
<head>
<title>3D CSS Clock</title>
<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #f0f0f0;
    overflow: hidden; /* Prevent scrollbars during animation */
}

.clock-container {
    width: 300px;
    height: 300px;
    position: relative;
    transform-style: preserve-3d; /* Enable 3D transforms */
    animation: rotateClock 60s linear infinite; /* Rotate the whole clock */
}

@keyframes rotateClock {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
}


.clock-face {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background-color: #fff;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
    position: absolute;
    top: 0;
    left: 0;
    transform-style: preserve-3d; /* Enable 3D transforms for the face */
}

.number {
    position: absolute;
    width: 20px;
    height: 20px;
    text-align: center;
    font-size: 16px;
    color: #333;
    transform-origin: 50% 150px; /* Rotate around the center of the clock */
}

.number:nth-child(1) { transform: rotate(30deg); }
.number:nth-child(2) { transform: rotate(60deg); }
.number:nth-child(3) { transform: rotate(90deg); }
.number:nth-child(4) { transform: rotate(120deg); }
.number:nth-child(5) { transform: rotate(150deg); }
.number:nth-child(6) { transform: rotate(180deg); }
.number:nth-child(7) { transform: rotate(210deg); }
.number:nth-child(8) { transform: rotate(240deg); }
.number:nth-child(9) { transform: rotate(270deg); }
.number:nth-child(10) { transform: rotate(300deg); }
.number:nth-child(11) { transform: rotate(330deg); }

.hand {
    position: absolute;
    transform-origin: 50% 100%; /* Rotate from the center */
    background-color: black;
    border-radius: 5px;
}

.hour-hand {
    width: 8px;
    height: 80px;
    top: 70px; /* Adjust to center */
    left: calc(50% - 4px);
    background-color: #333;
    z-index: 3;
}

.minute-hand {
    width: 6px;
    height: 120px;
    top: 30px; /* Adjust to center */
    left: calc(50% - 3px);
    background-color: #666;
    z-index: 2;
}

.second-hand {
    width: 2px;
    height: 140px;
    top: 10px; /* Adjust to center */
    left: calc(50% - 1px);
    background-color: red;
    z-index: 1;
}

/* Depth (optional - for a more pronounced 3D effect) */
.clock-face {
  transform: translateZ(20px);
}
.hour-hand {
  transform: translateZ(30px);
}
.minute-hand {
  transform: translateZ(25px);
}
.second-hand {
  transform: translateZ(20px);
}


</style>
</head>
<body>

<div class="clock-container">
    <div class="clock-face">
        <div class="number" style="transform: rotate(30deg);">1</div>
        <div class="number" style="transform: rotate(60deg);">2</div>
        <div class="number" style="transform: rotate(90deg);">3</div>
        <div class="number" style="transform: rotate(120deg);">4</div>
        <div class="number" style="transform: rotate(150deg);">5</div>
        <div class="number" style="transform: rotate(180deg);">6</div>
        <div class="number" style="transform: rotate(210deg);">7</div>
        <div class="number" style="transform: rotate(240deg);">8</div>
        <div class="number" style="transform: rotate(270deg);">9</div>
        <div class="number" style="transform: rotate(300deg);">10</div>
        <div class="number" style="transform: rotate(330deg);">11</div>
        <div class="number" style="transform: rotate(0deg);">12</div>

        <div class="hand hour-hand"></div>
        <div class="hand minute-hand"></div>
        <div class="hand second-hand"></div>
    </div>
</div>

<script>
function updateClock() {
    const now = new Date();
    const hours = now.getHours();
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();

    const hourRotation = (hours % 12 + minutes / 60) * 30; // Degrees per hour
    const minuteRotation = (minutes + seconds / 60) * 6;      // Degrees per minute
    const secondRotation = seconds * 6;                     // Degrees per second

    const hourHand = document.querySelector('.hour-hand');
    const minuteHand = document.querySelector('.minute-hand');
    const secondHand = document.querySelector('.second-hand');

    hourHand.style.transform = `rotate(${hourRotation}deg) translateZ(30px)`;
    minuteHand.style.transform = `rotate(${minuteRotation}deg) translateZ(25px)`;
    secondHand.style.transform = `rotate(${secondRotation}deg) translateZ(20px)`;
}

setInterval(updateClock, 1000); // Update every second
updateClock(); // Initial update

</script>

</body>
</html>
